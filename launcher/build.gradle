apply plugin: 'com.android.application'
apply plugin: 'com.github.kt3k.coveralls'
apply plugin: 'checkstyle'

checkstyle {
    toolVersion = '6.19'
}

check.dependsOn 'checkstyle'

tasks.register('checkstyle', Checkstyle) {
    configFile file("${project.rootDir}/style/checkstyle.xml")
    configProperties.checkstyleSuppressionsPath = file("${project.rootDir}/style/suppressions.xml").absolutePath

    source 'src/main/java'
    include 'org/cosinus/**/*.java'
    exclude '**/gen/**'

    def configProps = ['proj.module.dir': projectDir.absolutePath]
    configProperties configProps

    classpath = files()
}

android {
    namespace 'org.cosinus.launchertv'
    compileSdk 37
    buildToolsVersion '37.0.0'

    lint {
        abortOnError true
        lintConfig file('lint.xml')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "org.cosinus.launchertv"
        minSdkVersion 14
        targetSdkVersion 37
        versionCode 201
        versionName "2.0.1"
    }

    signingConfigs {
        if (project.hasProperty('keystorePassword')) {
            release {
                storeFile file(property('keystoreFile'))
                storePassword property('keystorePassword')
                keyAlias property('keystoreAlias')
                keyPassword property('keystorePassword')
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            proguardFiles 'proguard-rules.pro'
            if (project.hasProperty('keystorePassword')) {
                //noinspection GroovyAssignabilityCheck
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            enableAndroidTestCoverage true
        }
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:25.4.0'
}

coveralls {
    jacocoReportPath = layout.buildDirectory.file('reports/coverage/androidTest/debug/connected/report.xml').get().asFile.path
}

tasks.named('coveralls') {
    dependsOn 'connectedAndroidTest'
    onlyIf { System.env.'CI' }
}
