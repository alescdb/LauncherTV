buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'com.github.kt3k.coveralls:com.github.kt3k.coveralls.gradle.plugin:2.12.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
